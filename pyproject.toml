[tool.black]
line-length = 88
target-version = ['py310'] # Or your target Python version

[tool.isort]
profile = "black"
line_length = 88

# flake8 config lives in .flake8 - flake8 does not read pyproject.toml natively.

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true