name: New model
version: 0.0.1
schema: v1
models:
  - provider: anthropic
    model: claude-3-7-sonnet-latest
    apiKey: ${{ secrets.ANTHROPIC_API_KEY }}
    name: Claude 3.7 Sonnet
    roles:
      - chat
      - edit

  - provider: openai
    model: gemma4:26b
    apiBase: http://localhost:8013/v1
    apiKey: dummy-key
    name: MCP Gemma4 (Memory + RAG + Tools)
    roles:
      - chat

  - provider: openai
    model: gemma4-direct-edit
    apiBase: http://localhost:8013/v1
    apiKey: dummy-key
    name: MCP Gemma4 (Edit/Apply)
    roles:
      - edit
      - apply

